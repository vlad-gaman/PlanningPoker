name: Roll back staging

# Manual only. Redeploys, by digest, an image pushed by an earlier "Deploy to staging" run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to redeploy (for example staging-12)
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Resolve the tag to a digest
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG" =~ ^staging-[0-9]+$ ]]; then
            echo "::error::Tag must look like staging-12"
            exit 1
          fi
          image="ghcr.io/${REPO,,}"
          digest=$(docker buildx imagetools inspect "$image:$TAG" --format '{{ .Manifest.Digest }}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve $TAG to a digest"
            exit 1
          fi
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Rolling back to $TAG ($image@$digest)" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    needs: resolve
    runs-on: ubuntu-latest
    environment: staging
    permissions: {}
    steps:
      - uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2.2.19
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.resolve.outputs.image }}
