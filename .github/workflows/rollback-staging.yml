name: Roll back staging

# Manual only. Redeploys the zip kept by an earlier "Deploy to staging" run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (for example staging-12)
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download the kept zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern site.zip
      - name: Unzip the site
        run: unzip -q site.zip -d site
      - uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2.2.19
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: site
