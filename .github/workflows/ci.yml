name: CI

on:
  push:
    branches: [angular-migration]
  pull_request:
    branches: [angular-migration]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build PlanningPoker.sln --configuration Release
      - run: dotnet test PlanningPoker.UnitTests --configuration Release --no-build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlanningPoker.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: PlanningPoker.Client/.nvmrc
          cache: npm
          cache-dependency-path: PlanningPoker.Client/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npm run build:api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wwwroot
          path: PlanningPoker.Api/wwwroot
          retention-days: 1

  package-and-e2e:
    needs: [backend, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: PlanningPoker.Client/.nvmrc
          cache: npm
          cache-dependency-path: PlanningPoker.Client/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wwwroot
          path: PlanningPoker.Api/wwwroot
      - name: Publish API with the built SPA
        run: dotnet publish PlanningPoker.Api --configuration Release --output publish
      - name: Zip the site
        run: cd publish && zip -r ../site.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site.zip
          retention-days: 30
      - name: Install Playwright
        working-directory: PlanningPoker.Client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests against the published app
        working-directory: PlanningPoker.Client
        env:
          CI: 'true'
          E2E_SERVER_COMMAND: dotnet ../publish/PlanningPoker.Api.dll
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: PlanningPoker.Client/playwright-report
          retention-days: 7
