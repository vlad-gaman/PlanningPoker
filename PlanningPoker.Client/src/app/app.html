<header class="navbar">
  <div class="shell">
    <a routerLink="/" class="brand">
      <img src="favicon-32x32.png" alt="Planning Poker logo" width="28" height="28" />
      Planning Poker
    </a>
    <app-theme-select />
  </div>
</header>
<main>
  <router-outlet />
</main>
<footer class="footer">
  <div class="shell">
    <div class="footer-links">
      <span>&copy; {{ year }} - Planning Poker</span>
      <span class="divider" aria-hidden="true">|</span>
      <a routerLink="/credits">Credits</a>
    </div>
    <a
      class="buymeacoffee-link"
      href="https://buymeacoffee.com/vladg"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg"
        alt="Buy Me A Coffee"
        width="12"
        height="12"
      />
    </a>
  </div>
</footer>

<nav class="proto-switcher">
  @for (v of proto.variants; track v) {
    <button type="button" [class.on]="proto.variant() === v" (click)="proto.set(v)">{{ v }}</button>
  }
  <span>N current · A Bootstrap + old CSS · B Material bent · C custom CSS</span>
</nav>
