<header class="navbar">
  <div class="shell">
    <a routerLink="/" class="brand">
      <img src="favicon-32x32.png" alt="{{ productName }} logo" width="28" height="28" />
      {{ productName }}
    </a>
    <app-theme-select />
  </div>
</header>
<main>
  <router-outlet />
</main>
<footer class="footer">
  <div class="shell">
    <nav class="compact-switch" aria-label="Compact layout prototype">
      <span>Compact layout:</span>
      @for (option of compactOptions; track option) {
        <button type="button" [attr.aria-pressed]="compact() === option" (click)="chooseCompact(option)">{{ option.toUpperCase() }}</button>
      }
    </nav>
    <div class="footer-links">
      <span>&copy; {{ year }} - {{ productName }}</span>
      <span class="divider" aria-hidden="true">|</span>
      <a routerLink="/credits">Credits</a>
    </div>
    <a
      class="buymeacoffee-link"
      href="https://buymeacoffee.com/vladg"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="https://cdn.buymeacoffee.com/buttons/bmc-new-btn-logo.svg"
        alt="Buy Me A Coffee"
        width="12"
        height="12"
      />
    </a>
  </div>
</footer>
