<div class="accent">
  <span class="swatch" aria-hidden="true"></span>
  <select aria-label="Accent colour" #select (change)="pick(select.value)">
    @for (preset of presets; track preset.id) {
      <option [value]="preset.id" [selected]="preset.id === accent.accent()">
        {{ preset.label }}
      </option>
    }
  </select>
</div>
