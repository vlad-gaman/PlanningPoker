<div class="segmented segmented-icons card-back-select" role="radiogroup" aria-label="Card back">
  @for (option of options; track option.id) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="cardBacks.cardBack() === option.id"
      [attr.title]="option.label"
      (click)="cardBacks.set(option.id)"
    >
      <span class="card-back swatch" [attr.data-back]="option.id" aria-hidden="true"></span>
      <span class="visually-hidden">{{ option.label }}</span>
    </button>
  }
</div>
