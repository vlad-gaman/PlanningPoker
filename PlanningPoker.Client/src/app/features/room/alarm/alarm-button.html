@if (enabled()) {
  <button
    type="button"
    class="alarm"
    [class.running]="alarm().status === 'running'"
    [class.elapsed]="alarm().status === 'elapsed'"
    [class.jingle]="jingle()"
    [attr.aria-label]="label()"
    (click)="press()"
  >
    <span class="icon" aria-hidden="true">{{ icon() }}</span>
    <span class="text" aria-hidden="true">{{ text() }}</span>
  </button>
}
