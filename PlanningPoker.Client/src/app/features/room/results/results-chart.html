<figure class="chart">
  <figcaption>{{ title() }}</figcaption>
  @if (empty()) {
    <p class="no-votes">No votes</p>
  } @else {
    <div class="canvas-box">
      <canvas #canvas role="img" [attr.aria-label]="summary()"></canvas>
    </div>
  }
  <p class="average">
    Average: <span class="value">{{ average() }}</span>
  </p>
  @if (mostVotes(); as most) {
    <p class="most">
      Most votes: <span class="value">{{ most }}</span>
    </p>
  }
</figure>
