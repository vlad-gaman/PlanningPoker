<section class="home">
  <h1 class="visually-hidden">Planning Poker</h1>

  @if (flash.message(); as notice) {
    <p class="notice" role="status">{{ notice }}</p>
  }

  <form (ngSubmit)="createRoom()" [formGroup]="form">
    <app-person-fields [form]="form" />
    <div class="row">
      <input id="use-fun-room-name" type="checkbox" [formControl]="useFunRoomName" />
      <label for="use-fun-room-name">Use a fun name?</label>
    </div>
    <button class="plain-button" type="button" (click)="editSettings()">Room settings</button>
    <button class="plain-button" type="submit">Create room</button>
  </form>

  <form class="join" [formGroup]="joinForm" (ngSubmit)="joinRoom()">
    <div class="row">
      <label for="room-name">Room Name:</label>
      <input class="plain-input" id="room-name" formControlName="room" autocomplete="off" />
    </div>
    @if (joinForm.controls.room.invalid && joinForm.controls.room.touched) {
      <div class="field-error" role="alert">Enter a room name or link.</div>
    }
    <button class="plain-button" type="submit">Join room</button>
  </form>

  @if (error(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }
</section>
