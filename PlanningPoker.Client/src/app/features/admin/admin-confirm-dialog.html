<h2 mat-dialog-title>{{ data.title }}</h2>
<div class="content">
  <p>{{ data.detail }}</p>
</div>
<div class="actions">
  <button type="button" class="secondary-button" [mat-dialog-close]="false">Cancel</button>
  <button type="button" class="danger-button" [mat-dialog-close]="true" cdkFocusInitial>{{ data.confirmLabel }}</button>
</div>
