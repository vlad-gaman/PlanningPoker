<section class="credits">
  <h1>Credits</h1>
  <h2>Libraries</h2>
  <ul>
    @for (library of libraries; track library.name) {
      <li>
        <a [href]="library.url" target="_blank" rel="noopener noreferrer">{{ library.name }}</a>
        ({{ library.license }})
      </li>
    }
  </ul>
</section>
