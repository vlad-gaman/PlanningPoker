<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <path id="head" d="M64,20 C92,20 114,36 114,66 C114,80 117,88 122,94 L111,97 L118,104 C104,112 24,112 10,104 L17,97 L6,94 C11,88 14,80 14,66 C14,36 36,20 64,20 Z"/>
    <path id="stripe" d="M93,56 C103,59 108,72 106,84 C104,94 96,102 82,104 C90,99 95,90 95,78 C95,68 92,61 93,56 Z" fill="#fff"/>
    <g id="ear">
