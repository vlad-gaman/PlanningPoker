      <path d="M18,30 Q20,18 28,16 Q30,24 28,32 Q22,34 18,30 Z" fill="#d9532b"/>
    </g>
    <path id="tail" d="M78,108 C112,110 118,86 112,68 C107,52 98,46 104,32"/>
  </defs>
  <!-- bushy tail, behind the body (first drawing) -->
  <use xlink:href="#tail" fill="none" stroke="#2a120a" stroke-width="22" stroke-linecap="round"/>
  <use xlink:href="#tail" fill="none" stroke="#c8552b" stroke-width="18" stroke-linecap="butt"/>
  <use xlink:href="#tail" fill="none" stroke="#7a2e14" stroke-width="18" stroke-linecap="butt" stroke-dasharray="5 6" stroke-linejoin="round"/>
  <!-- arms -->
  <g stroke="#2a120a" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="42" cy="88" rx="7" ry="11" fill="#c8552b"/>
    <ellipse cx="86" cy="88" rx="7" ry="11" fill="#c8552b"/>
    <!-- body -->
    <path d="M48 66 C38 80 36 104 42 116 L86 116 C92 104 90 80 80 66 Z" fill="#c8552b"/>
    <!-- dark belly -->
    <ellipse cx="64" cy="98" rx="13" ry="15" fill="#4a2216" stroke="none"/>
    <!-- feet -->
    <ellipse cx="51" cy="117" rx="9" ry="6" fill="#3a1a10"/>
    <ellipse cx="77" cy="117" rx="9" ry="6" fill="#3a1a10"/>
  </g>
  <!-- new face, on the neck, scaled to half size; strokes compensated -->
  <g transform="matrix(0.5 0 0 0.5 32 20)">
    <use xlink:href="#ear"/>
    <use xlink:href="#ear" transform="matrix(-1 0 0 1 128 0)"/>
    <use xlink:href="#head" fill="#d9532b"/>
    <use xlink:href="#stripe"/>
    <use xlink:href="#stripe" transform="matrix(-1 0 0 1 128 0)"/>
    <path d="M34,42 Q46,44 52,52 Q44,48 34,50 Z" fill="#fff"/>
    <path d="M94,42 Q82,44 76,52 Q84,48 94,50 Z" fill="#fff"/>
    <path d="M64,78 C77,78 86,84 86,94 C86,104 78,110 64,110 C50,110 42,104 42,94 C42,84 51,78 64,78 Z" fill="#fff"/>
    <circle cx="44" cy="68" r="7" fill="#111"/>
    <circle cx="46" cy="65" r="2" fill="#fff"/>
    <circle cx="84" cy="68" r="7" fill="#111"/>
    <circle cx="82" cy="65" r="2" fill="#fff"/>
    <path d="M57,86 Q64,80 71,86 Q68,96 64,96 Q60,96 57,86 Z" fill="#1a1a1a"/>
    <path d="M64,96 V101" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <path d="M52,102 Q58,110 64,101 Q70,110 76,102" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
    <use xlink:href="#head" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
